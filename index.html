<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d17">
<title>Parada Obrigatória | Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ecdc; --surface:#fffaf1; --surface-2:#efe3cf; --line:#e4d4ba; --line-2:#d3bd9b;
  --text:#2a1c15; --muted:#77604f;
  --accent:#f0b323; --accent-2:#cf8f06; --accent-soft:#fbe8b6; --on-accent:#2a1c15;
  --dark:#2b1d17; --dark-2:#3a2820; --dark-3:#4b362b; --on-dark:#f7efe2; --on-dark-muted:#c6b19b;
  --ok:#2a7d4d; --ok-soft:#d9eedf; --warn:#a85f00; --warn-soft:#fae4bf;
  --danger:#b3372a; --danger-soft:#f6dad4;
  --shadow:0 1px 2px rgba(43,29,23,.06),0 10px 24px -16px rgba(43,29,23,.35);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Anton",Impact,"Arial Narrow Bold","Helvetica Neue",sans-serif;
  --f-script:"Kaushan Script","Brush Script MT","Segoe Script",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150f0b; --surface:#201712; --surface-2:#2b2019; --line:#3a2c23; --line-2:#4d3a2e;
    --text:#f4e9d9; --muted:#b29c87;
    --accent:#f3b830; --accent-2:#f6c75a; --accent-soft:#3c2d10; --on-accent:#22160e;
    --dark:#0e0906; --dark-2:#1e1510; --dark-3:#2e2219; --on-dark:#f4e9d9; --on-dark-muted:#a8917b;
    --ok:#5cb985; --ok-soft:#163022; --warn:#e8a447; --warn-soft:#382811;
    --danger:#e8705d; --danger-soft:#3b1c17;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150f0b; --surface:#201712; --surface-2:#2b2019; --line:#3a2c23; --line-2:#4d3a2e;
  --text:#f4e9d9; --muted:#b29c87;
  --accent:#f3b830; --accent-2:#f6c75a; --accent-soft:#3c2d10; --on-accent:#22160e;
  --dark:#0e0906; --dark-2:#1e1510; --dark-3:#2e2219; --on-dark:#f4e9d9; --on-dark-muted:#a8917b;
  --ok:#5cb985; --ok-soft:#163022; --warn:#e8a447; --warn-soft:#382811;
  --danger:#e8705d; --danger-soft:#3b1c17;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{max-width:100%}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

/* header + nav */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--dark);color:var(--on-dark)}
.hd-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .hat{color:var(--accent)}
.bn{font-family:var(--f-script);font-size:21px;line-height:1;white-space:nowrap}
.bn b{color:var(--accent);font-weight:400}
.bs{font-size:12px;color:var(--on-dark-muted);margin-top:4px;font-weight:600}
.dtabs{display:none;gap:4px;margin:0 auto}
.dtabs button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--on-dark-muted);font-weight:700;font-size:15px}
.dtabs button:hover{color:var(--on-dark)}
.dtabs button.on{background:var(--dark-2);color:var(--accent)}
.op{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--dark-2);border:1px solid var(--dark-3);border-radius:999px;padding:4px 12px 4px 4px;color:var(--on-dark);font-weight:700;font-size:14px;flex:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--text);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.av.sm{width:28px;height:28px;font-size:13px;background:var(--accent);color:var(--on-accent)}
main{max-width:1040px;margin:0 auto;padding:18px 16px 140px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--muted);position:relative}
.bnav button.on{color:var(--text)}
.bnav button.on .ic{color:var(--accent-2)}
.dot{position:absolute;top:0;left:calc(50% + 6px);min-width:19px;height:19px;line-height:19px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;text-align:center;padding:0 5px}
.dtabs .dot{position:static;display:inline-block}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;padding:15px 20px;border-radius:16px;box-shadow:0 14px 28px -10px rgba(43,29,23,.55)}
@media(min-width:900px){
  .dtabs{display:flex}.op{margin-left:0}.bnav{display:none}
  main{padding:28px 24px 120px}
  .fab{bottom:28px;right:max(24px,calc((100vw - 1040px)/2 + 24px))}
}

/* type + blocks */
.t1{font-family:var(--f-display);font-weight:400;font-size:30px;text-transform:uppercase;line-height:1;margin:0;letter-spacing:.01em}
.t2{font-size:20px;font-weight:800;margin:0;line-height:1.2}
.t3{font-size:17px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:15px;margin:6px 0 0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card + .card{margin-top:14px}
.small{font-size:13.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);white-space:nowrap;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.x{padding:8px;border-radius:50%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--accent-2);font-weight:700;font-size:15px;padding:10px 0;display:inline-flex;align-items:center;gap:6px}

.inp{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:60px}
.lbl{font-size:14px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px}
.field{margin-top:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:0 14px}
.search input{border:0;background:none;outline:none;padding:12px 0;width:100%;font-size:16px}

.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line-2);flex:none;transition:background .15s;display:inline-block}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(18px)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line-2);font-weight:700;font-size:15px;background:var(--surface)}
.opt.on{border-color:var(--accent-2);background:var(--accent-soft)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:15px}
.empty .ic{margin:0 auto 10px;opacity:.5}

/* pedidos */
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:5px;border-radius:16px;margin:4px 0 16px}
.stabs button{padding:10px 4px 9px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.stabs button b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--text)}
.stabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.stabs button.on b{color:var(--accent-2)}
.olist{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.olist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.order{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.o-top{display:flex;gap:12px;align-items:center}
.ch{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.o-name{font-weight:800;font-size:17px;line-height:1.2}
.o-sub{font-size:14px;color:var(--muted)}
.o-time{margin-left:auto;text-align:right;font-size:13.5px;color:var(--muted);flex:none}
.o-time b{display:block;font-size:17px;color:var(--text)}
.o-time .late{color:var(--danger);font-weight:700}
.o-items{font-size:16px;line-height:1.55}
.o-items .q{font-weight:800}
.o-obs{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);padding:9px 11px;border-radius:11px;font-weight:600;font-size:15px}
.o-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:2px}
.o-total{font-weight:800;font-size:18px}
.pay{font-size:14px;font-weight:700}
.pay.ok{color:var(--ok)}.pay.warn{color:var(--warn)}.pay.mut{color:var(--muted)}
.o-acts{display:flex;gap:8px}
.o-acts .main{flex:1;height:52px;font-size:16px}
.icon-btn{width:52px;height:52px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--surface);flex:none}

/* contas */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px}
.month b{font-size:16px}
.month button{width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.month button:disabled{opacity:.3}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum.three{grid-template-columns:repeat(3,1fr)}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.sbox span{font-size:13.5px;color:var(--muted);font-weight:700;display:block}
.sbox b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sbox.dark{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.sbox.dark span{color:var(--on-dark-muted)}
.sbox.dark b{color:var(--accent)}
.sbox.big b{font-size:40px}
@media(max-width:420px){.sum.three .sbox b{font-size:21px}.sum.three .sbox.big b{font-size:32px}.sum.three .sbox{padding:12px 10px}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%}
.li:first-child{border-top:0}
.li-m{flex:1;min-width:0}
.li-m b{display:block;font-size:16px}
.li-m span{display:block;font-size:14px;color:var(--muted)}
.li-r{text-align:right;flex:none}
.li-r b{display:block;font-size:16px}
.li-r small{font-size:12.5px;font-weight:700}
.li-r .due{color:var(--warn)}
.li-r .okt{color:var(--ok)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools .search{flex:1;min-width:200px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);padding:6px 0;margin-bottom:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.acts .btn{flex:1 1 auto}
.rec{display:grid;gap:10px;font-size:15px}
.rec div{display:flex;justify-content:space-between;gap:10px}
.rec .tot{border-top:1px dashed var(--line-2);padding-top:10px;font-weight:800;font-size:17px}
.day{font-size:13.5px;font-weight:800;color:var(--muted);padding:14px 16px 4px;background:var(--surface-2)}
.ent{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);width:100%}
.day + .ent{border-top:0}
.ent .l{flex:1;min-width:0}
.ent .l b{display:block;font-size:15px}
.ent .l span{display:block;font-size:14.5px}
.ent .l small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ent .r{text-align:right;flex:none}
.ent .r b{display:block;font-size:15.5px}
.ent .r small{font-size:12.5px;font-weight:700;color:var(--muted)}
.ent.pay .r b{color:var(--ok)}
.ent.cx .l b,.ent.cx .l span,.ent.cx .r b{text-decoration:line-through;color:var(--muted)}
.hist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14.5px;margin-top:12px}
.hist .w{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px;padding-top:1px}

/* canais */
.chans{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.chans{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column}
.chan-h{display:flex;align-items:center;gap:12px}
.chan-h .t3{line-height:1.2}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ok)}
.conn i{width:8px;height:8px;border-radius:50%;background:currentColor}
.conn.off{color:var(--muted)}
.chan-n{margin-left:auto;text-align:right;flex:none}
.chan-n b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.chan-n span{font-size:12.5px;color:var(--muted);font-weight:600}
.chan-p{font-size:14.5px;color:var(--muted);margin:12px 0 14px;flex:1}
.chan-a{display:flex;gap:8px;flex-wrap:wrap}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;font-weight:700;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:14px}

/* cardapio */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .nm{flex:1;min-width:0;font-weight:700}
.mrow.off .nm{color:var(--muted)}
.price{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:0 10px;font-weight:700;color:var(--muted)}
.price input{width:64px;border:0;background:none;outline:none;padding:9px 0;font-size:15px;font-weight:700;color:var(--text);text-align:right}

/* sheets */
.layer{position:fixed;inset:0;z-index:60;display:none}
.layer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,12,8,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.layer.anim .backdrop{animation:fade .2s ease}
.layer.anim .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media(min-width:900px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(580px,92vw);border-radius:22px;max-height:88vh;padding:22px 24px}
  .layer.anim .sheet{animation:pop .2s ease}
  .grab{display:none}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line-2);font-weight:700;background:var(--surface)}
.tile .ch{width:36px;height:36px;border-radius:10px}
.tile.on{border-color:var(--accent-2);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14.5px}
.chip.sel{background:var(--dark);color:var(--on-dark)}
.chip small{font-weight:600;opacity:.75}
.irow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .nm{flex:1;min-width:0}
.irow .nm b{display:block;font-weight:700}
.irow .nm span{font-size:14px;color:var(--muted)}
.irow.has .nm b{color:var(--text)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;flex:none}
.step button{width:42px;height:42px;display:grid;place-items:center}
.step span{min-width:26px;text-align:center;font-weight:800}
.irow.has .step{border-color:var(--accent-2);background:var(--accent-soft)}
.line{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line-2)}
.line:first-child{border-top:0}
.line .q{font-weight:800;min-width:28px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.box{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px;font-weight:600;font-size:14.5px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.bigv{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--ok)}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function monthOf(off){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return dk(d).slice(0,7);}
function monthShort(mk){const a=mk.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleDateString('pt-BR',{month:'long'});}
function monthName(mk){return cap(monthShort(mk))+' '+mk.slice(0,4);}
function dayLabel(s){if(s===TODAY)return 'Hoje';const d=parseDk(s);const w=d.toLocaleDateString('pt-BR',{weekday:'long'}).split('-')[0];return cap(w)+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);}

function todayLong(){const d=new Date();return cap(d.toLocaleDateString('pt-BR',{weekday:'long'}))+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function parseMoney(v){let s=String(v||'').trim().replace(/[^\d,.-]/g,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;}

function mkItem(m,q){return {pid:m.id,nome:m.nome,tipo:m.tipo,qtd:q||1,preco:m.preco};}
function pagoInicial(forma,st){return forma==='pix'||forma==='ifood'||((forma==='dinheiro'||forma==='cartao')&&st==='entregue');}
function seedOrder(s,c,day,hora,r,st){
  const pick=a=>a[Math.floor(r()*a.length)];
  const on=s.menu.filter(m=>m.on),al=on.filter(m=>m.tipo==='almoco'),la=on.filter(m=>m.tipo==='lanche'),be=on.filter(m=>m.tipo==='bebida');
  if(!on.length)return null;
  const mains=al.length?al:(la.length?la:on);
  const itens=[mkItem((r()<.1&&la.length)?pick(la):pick(mains),r()<.05?2:1)];
  if(be.length&&r()<.35)itens.push(mkItem(pick(be),1));
  const forma=c.canal==='ifood'?'ifood':c.pag;
  const o={id:++s.seq,cid:c.id,canal:c.canal,data:day,hora,itens,obs:r()<.12?pick(OBS):'',forma,st,pago:false,log:[]};
  o.total=sum(itens,i=>i.preco*i.qtd);
  o.log.push(c.canal==='balcao'?{d:day,h:hora,who:pick(OPS),a:'lançou o pedido no balcão'}:{d:day,h:hora,who:'Sistema',a:'recebeu o pedido pelo '+CANAIS[c.canal].n});
  let t=toMin(hora);
  if(st==='cancelado'){o.log.push({d:day,h:hm(t+6),who:'Rosa',a:'cancelou o pedido. Motivo: Pedido duplicado'});s.orders.push(o);return o;}
  for(let k=1;k<=ST.indexOf(st);k++){
    t+=5+Math.floor(r()*20);const who=pick(OPS);
    let a=ACT[ST[k]];
    if(ST[k]==='entregue'&&(forma==='dinheiro'||forma==='cartao'))a+=' e recebeu '+brl(o.total)+(forma==='dinheiro'?' em dinheiro':' no cartão');
    o.log.push({d:day,h:hm(t),who,a});
  }
  o.pago=pagoInicial(forma,st);
  s.orders.push(o);return o;
}
function fresh(){
  const s={v:1,menu:MENU.map(m=>({...m})),clients:[],orders:[],pays:[],seq:300,pseq:0,canais:{whatsapp:true,instagram:true,ifood:true,ifoodAberto:true},auto:false,theme:'auto'};
  CLIENTS.forEach((c,i)=>s.clients.push({id:'c'+(i+1),nome:c[0],tel:c[1],local:c[2],canal:c[3],pag:c[4],freq:c[5]}));
  const r=rng(2026),today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today.getFullYear(),today.getMonth()-1,1);
  for(const d=new Date(start);d<today;d.setDate(d.getDate()+1)){
    const wd=d.getDay();if(wd===0||wd===6)continue;
    const day=dk(d);
    s.clients.filter(c=>r()<c.freq).map(c=>({c,t:7*60+40+Math.floor(r()*200)})).sort((a,b)=>a.t-b.t)
      .forEach(x=>seedOrder(s,x.c,day,hm(x.t),r,r()<.025?'cancelado':'entregue'));
  }
  const pm=monthOf(-1);
  s.clients.filter(c=>c.pag==='conta').forEach((c,i)=>{
    const debt=sum(s.orders.filter(o=>o.cid===c.id&&o.forma==='conta'&&o.st!=='cancelado'&&o.data.slice(0,7)===pm),o=>o.total);
    if(!debt||c.nome==='Larissa Oliveira')return;
    const pd=new Date(today.getFullYear(),today.getMonth(),2+(i%3));
    if(dk(pd)>=TODAY)return;
    const v=c.nome==='Ricardo Lima'?Math.round(debt*.6):debt,forma=i%2?'dinheiro':'pix',h='14:'+pad(5+i*4);
    s.pays.push({id:'p'+(++s.pseq),cid:c.id,valor:v,forma,data:dk(pd),hora:h,who:'Rosa',obs:'Referente a '+monthShort(pm),est:false,
      log:[{d:dk(pd),h,who:'Rosa',a:'registrou o pagamento de '+brl(v)+' ('+FORMA[forma]+')'}]});
  });
  const pool=s.clients.slice().sort(()=>r()-.5).slice(0,11);
  const sts=['entregue','entregue','entregue','pronto','pronto','fazendo','fazendo','novo','novo','novo','novo'];
  pool.map((c,i)=>({c,t:7*60+40+Math.floor(r()*190)})).sort((a,b)=>a.t-b.t).forEach((x,i)=>seedOrder(s,x.c,TODAY,hm(x.t),r,sts[i]));
  return s;
}

/* ---------- account math ---------- */
function contaStats(cid,mk){
  const os=S.orders.filter(o=>o.cid===cid&&o.st!=='cancelado');
  const mo=os.filter(o=>o.data.slice(0,7)===mk);
  const ps=S.pays.filter(p=>p.cid===cid&&!p.est);
  const start=mk+'-01';
  const q=t=>sum(mo,o=>sum(o.itens.filter(i=>i.tipo===t),i=>i.qtd));
  const contaAll=os.filter(o=>o.forma==='conta');
  const ini=sum(contaAll.filter(o=>o.data<start),o=>o.total)-sum(ps.filter(p=>p.data<start),p=>p.valor);
  const lanc=sum(mo.filter(o=>o.forma==='conta'),o=>o.total);
  const pagMes=sum(ps.filter(p=>p.data.slice(0,7)===mk),p=>p.valor);
  return {pedidos:mo.length,almocos:q('almoco'),lanches:q('lanche'),bebidas:q('bebida'),consumo:sum(mo,o=>o.total),
    ini,lanc,pagMes,fim:ini+lanc-pagMes,saldo:sum(contaAll,o=>o.total)-sum(ps,p=>p.valor),usaConta:contaAll.length>0||ps.length>0};
}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function countPhrase(st,mk){
  const parts=[];
  if(st.almocos)parts.push(plural(st.almocos,'almoço','almoços'));
  if(st.lanches)parts.push(plural(st.lanches,'lanche','lanches'));
  if(!parts.length&&st.bebidas)parts.push(plural(st.bebidas,'bebida','bebidas'));
  return parts.length?parts.join(' e ')+' em '+monthShort(mk):'Sem pedidos em '+monthShort(mk);
}
function extratoText(c,mk){
  const st=contaStats(c.id,mk);
  const os=S.orders.filter(o=>o.cid===c.id&&o.st!=='cancelado'&&o.data.slice(0,7)===mk).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const ps=S.pays.filter(p=>p.cid===c.id&&!p.est&&p.data.slice(0,7)===mk);
  let t=`Olá, ${c.nome.split(' ')[0]}! Aqui é da Parada Obrigatória.\nSegue seu extrato de ${monthShort(mk)}:\n\n`;
  os.forEach(o=>{t+=`${ddmm(o.data)} ${o.itens.map(i=>(i.qtd>1?i.qtd+'x ':'')+i.nome).join(' + ')}: ${brl(o.total)}${o.forma==='conta'?'':' (pago na hora)'}\n`;});
  ps.forEach(p=>{t+=`${ddmm(p.data)} Pagamento recebido: ${brl(p.valor)}\n`;});
  t+=`\n${countPhrase(st,mk)}\n`;
  if(st.usaConta){
    if(Math.abs(st.ini)>.004)t+=`Saldo anterior: ${brl(st.ini)}\n`;
    t+=`Lançado na conta: ${brl(st.lanc)}\nPagamentos: ${brl(st.pagMes)}\n*Em aberto: ${brl(st.fim)}*\n`;
    if(st.fim>.004)t+='\nPix para pagamento: paradaobrigatoria@exemplo.com.br\n';
  }
  return t+'\nQualquer dúvida é só chamar!';
}

/* ---------- views: contas ---------- */
function monthBar(){
  return `<div class="month noprint"><button data-act="mon" data-v="-1" aria-label="Mês anterior"${UI.mon<=-6?' disabled':''}>${ic('back',20)}</button><b>${monthName(monthOf(UI.mon))}</b><button data-act="mon" data-v="1" aria-label="Próximo mês"${UI.mon>=0?' disabled':''}>${ic('next',20)}</button></div>`;
}
function initials(n){return n.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();}
function vContas(){
  if(UI.person&&S.clients.some(c=>c.id===UI.person))return vPessoa();
  const mk=monthOf(UI.mon);
  let rows=S.clients.map(c=>({c,st:contaStats(c.id,mk)})).filter(x=>x.st.pedidos>0||x.st.saldo>.004);
  const receber=sum(S.clients,c=>Math.max(0,contaStats(c.id,mk).saldo));
  const recebido=sum(S.pays.filter(p=>!p.est&&p.data.slice(0,7)===mk),p=>p.valor);
  const q=UI.cq.trim().toLowerCase();
  if(q)rows=rows.filter(x=>(x.c.nome+' '+x.c.local).toLowerCase().includes(q));
  if(UI.cOpen)rows=rows.filter(x=>x.st.saldo>.004);
  rows.sort((a,b)=>b.st.saldo-a.st.saldo||b.st.consumo-a.st.consumo);
  let h=`<div class="ph"><div><h1 class="t1">Contas</h1><p class="sub">Quanto cada pessoa pediu no mês e quanto ainda falta pagar.</p></div></div>${monthBar()}`;
  h+=`<div class="sum"><div class="sbox dark"><span>Para receber</span><b>${brl(receber)}</b></div><div class="sbox"><span>Recebido em ${monthShort(mk)}</span><b>${brl(recebido)}</b></div></div>`;
  h+=`<div class="tools"><label class="search">${ic('search',18)}<input id="cq" data-in="cq" value="${esc(UI.cq)}" placeholder="Buscar pessoa ou setor" aria-label="Buscar pessoa"></label><div class="seg" style="min-width:220px"><button class="${UI.cOpen?'':'on'}" data-act="cOpen" data-v="0">Todos</button><button class="${UI.cOpen?'on':''}" data-act="cOpen" data-v="1">Devendo</button></div></div>`;
  if(!rows.length)return h+`<div class="card empty">${ic('wallet',32)}${UI.cOpen?'Ninguém devendo. Tudo em dia!':'Nenhum pedido neste mês.'}</div>`;
  h+=`<div class="list">${rows.map(({c,st})=>`<button class="li" data-act="person" data-v="${c.id}"><span class="av">${esc(initials(c.nome))}</span><span class="li-m"><b>${esc(c.nome)}</b><span>${countPhrase(st,mk)}</span></span><span class="li-r">${st.saldo>.004?`<b class="num">${brl(st.saldo)}</b><small class="due">em aberto</small>`:`<b class="num">${brl(st.consumo)}</b><small class="okt">${st.usaConta?'em dia':'pago na hora'}</small>`}</span>${ic('next',18)}</button>`).join('')}</div>`;

function vPessoa(){
  const c=cli(UI.person),mk=monthOf(UI.mon),st=contaStats(c.id,mk),ms=monthShort(mk),cur=UI.mon===0;
  const os=S.orders.filter(o=>o.cid===c.id&&o.data.slice(0,7)===mk);
  const ps=S.pays.filter(p=>p.cid===c.id&&p.data.slice(0,7)===mk);
  let h=`<button class="back noprint" data-act="unperson">${ic('back',18)}Contas</button>`;
  h+=`<div class="ph"><div><h1 class="t1">${esc(c.nome)}</h1><p class="sub">${[c.local,c.tel,'Costuma pedir pelo '+CANAIS[c.canal].n].filter(Boolean).map(esc).join(', ')}</p></div></div>${monthBar()}`;
  h+=`<div class="sum three"><div class="sbox dark big"><span>${cap(TIPO_LABEL.almoco.toLowerCase())}</span><b>${st.almocos}</b></div><div class="sbox"><span>Consumo</span><b>${brl(st.consumo)}</b></div><div class="sbox"><span>${cur?'Em aberto':'Fechou em'}</span><b style="${(cur?st.saldo:st.fim)>.004?'color:var(--warn)':''}">${brl(cur?st.saldo:st.fim)}</b></div></div>`;
  h+=`<div class="acts noprint"><button class="btn pri" data-act="newPay" data-v="${c.id}">${ic('money',18)}Registrar pagamento</button>${c.tel?`<a class="btn" href="${waLink(c.tel,extratoText(c,mk))}" target="_blank" rel="noopener" data-act="waExtrato" data-v="${c.id}">${ic('send',18)}Enviar extrato</a>`:''}<button class="btn" data-act="print">${ic('print',18)}Imprimir</button></div>`;
  if(st.usaConta){
    const pm=monthShort(monthOf(UI.mon-1));
    h+=`<div class="card"><h2 class="t3" style="margin-bottom:12px">Conta do mês</h2><div class="rec">
      <div><span>Saldo de ${pm}</span><b class="num">${brl(st.ini)}</b></div>
      <div><span>Lançado na conta em ${ms}</span><b class="num">${brl(st.lanc)}</b></div>
      <div><span>Pagamentos em ${ms}</span><b class="num" style="color:var(--ok)">${st.pagMes?'− ':''}${brl(st.pagMes)}</b></div>
      <div class="tot"><span>${cur?'Em aberto agora':'Em aberto no fim de '+ms}</span><span class="num">${brl(st.fim)}</span></div></div></div>`;
  }
  const ents=[...os.map(o=>({k:o.data+o.hora+'o',d:o.data,o})),...ps.map(p=>({k:p.data+p.hora+'p',d:p.data,p}))].sort((a,b)=>b.k.localeCompare(a.k));
  h+=`<h2 class="t3" style="margin:22px 0 10px">Extrato de ${ms}</h2>`;
  if(!ents.length)h+=`<div class="card empty">${ic('list',30)}Sem movimento em ${ms}.</div>`;
  else{
    let last='',inner='';
    ents.forEach(e=>{
      if(e.d!==last){inner+=`<div class="day">${dayLabel(e.d)}</div>`;last=e.d;}
      if(e.o){const o=e.o,cxl=o.st==='cancelado';
        inner+=`<button class="ent${cxl?' cx':''}" data-act="openOrder" data-v="${o.id}"><span class="l"><b>Pedido ${pad4(o.id)}</b><span>${esc(o.itens.map(i=>(i.qtd>1?i.qtd+'x ':'')+i.nome).join(' + '))}</span><small>${o.hora}, ${CANAIS[o.canal].n}${cxl?', cancelado':''}</small></span><span class="r"><b class="num">${brl(o.total)}</b><small>${cxl?'cancelado':paidLabel(o)}</small></span></button>`;
      }else{const p=e.p;
        inner+=`<button class="ent pay${p.est?' cx':''}" data-act="openPay" data-v="${p.id}"><span class="l"><b>Pagamento recebido</b><span>${FORMA[p.forma]}${p.obs?', '+esc(p.obs):''}</span><small>${p.hora}, registrado por ${esc(p.who)}${p.est?', estornado':''}</small></span><span class="r"><b class="num">+ ${brl(p.valor)}</b><small>${p.est?'estornado':'abateu da conta'}</small></span></button>`;
      }
    });
    h+=`<div class="list">${inner}</div>`;
  }
  const logs=[];
  os.forEach(o=>o.log.forEach(l=>logs.push({...l,ref:'pedido '+pad4(o.id)})));
  ps.forEach(p=>p.log.forEach(l=>logs.push({...l,ref:'pagamento'})));
  logs.sort((a,b)=>(b.d+b.h).localeCompare(a.d+a.h));
  h+=`<div class="card" style="margin-top:14px"><button class="row between" style="width:100%" data-act="hist" aria-expanded="${UI.hist}"><span class="row"><span class="muted">${ic('history',20)}</span><span><b class="t3">Histórico de alterações</b><span class="small muted" style="display:block">Quem fez o quê e quando, para conferir</span></span></span><span class="muted" style="transform:rotate(${UI.hist?90:0}deg);transition:transform .15s">${ic('next',20)}</span></button>
    ${UI.hist?(logs.length?`<div class="hist">${logs.map(l=>`<span class="w">${ddmm(l.d)} ${l.h}</span><span><b>${esc(l.who)}</b> ${esc(l.a)} <span class="muted">(${l.ref})</span></span>`).join('')}</div>`:'<p class="sub">Nada registrado neste mês.</p>'):''}</div>`;
  return h;
}

function copy(t){

function simulate(canal){
  if(canal==='ifood'&&(!S.canais.ifood||!S.canais.ifoodAberto)){toast('A loja do iFood está fechada');return false;}
  if(!S.canais[canal]){toast(CANAIS[canal].n+' está pausado');return false;}
  const r=rng(Date.now()%1e6);
  let c;
  if(canal==='ifood'){const nm=IFOOD_NAMES[Math.floor(r()*IFOOD_NAMES.length)];c=S.clients.find(x=>x.nome===nm);if(!c){c={id:'c'+uid(),nome:nm,tel:'',local:'Entrega iFood',canal:'ifood',pag:'ifood',freq:0};S.clients.push(c);}}
  else{const pool=S.clients.filter(x=>x.canal===canal);c=pool[Math.floor(r()*pool.length)];}
  const o=seedOrder(S,c,TODAY,nowHM(),r,'novo');
  if(!o){toast('Ligue algum item no Cardápio primeiro');return false;}
  save();render();toast('Novo pedido pelo '+CANAIS[canal].n+': '+c.nome);
  return o;
}

};
const IN={
  noNome:v=>{UI.no.nome=v;render();},
  noTel:v=>{UI.no.tel=v;},
  noObs:v=>{UI.no.obs=v;},
  cq:v=>{UI.cq=v;render();},
  pfV:v=>{UI.pf.valor=v;},
  pfO:v=>{UI.pf.obs=v;},
  niN:v=>{UI.ni.nome=v;},
  niP:v=>{UI.ni.preco=v;}
};
const CH={
  noLocal:v=>{UI.no.local=v;},
  price:(v,el)=>{const m=S.menu.find(x=>x.id===el.getAttribute('data-v')),p=parseMoney(v);if(!m)return;if(!(p>=0)){render();return;}m.preco=p;save();render();toast('Preço de '+m.nome+' atualizado');}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.disabled)return;
  const fn=A[el.getAttribute('data-act')];if(!fn)return;
  if(el.tagName!=='A')e.preventDefault();
  if(UI.armed&&el.getAttribute('data-armkey')!==UI.armed)UI.armed=null;
  fn(el.getAttribute('data-v'),el,e);
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;const fn=IN[el.getAttribute('data-in')];if(fn)fn(el.value,el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const fn=CH[el.getAttribute('data-chg')];if(fn)fn(el.value,el);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet){UI.sheet=null;UI.cx=null;render();}});
setupAuto();
render();
})();
</script>
</body>
</html>
